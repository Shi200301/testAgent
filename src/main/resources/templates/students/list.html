<!DOCTYPE html>
<html lang="uz" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Talabalar Ro'yxati</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; color: #333; }
        .container { max-width: 900px; margin: 40px auto; padding: 0 20px; }
        h1 { font-size: 1.8rem; margin-bottom: 20px; color: #2c3e50; }
        .btn { display: inline-block; padding: 8px 16px; border-radius: 6px;
               text-decoration: none; font-size: 0.9rem; cursor: pointer; border: none; }
        .btn-primary { background: #3498db; color: white; }
        .btn-primary:hover { background: #2980b9; }
        .btn-warning { background: #f39c12; color: white; }
        .btn-warning:hover { background: #e67e22; }
        .btn-danger  { background: #e74c3c; color: white; }
        .btn-danger:hover  { background: #c0392b; }
        table { width: 100%; border-collapse: collapse; background: white;
                border-radius: 10px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        th { background: #2c3e50; color: white; padding: 14px 16px; text-align: left; }
        td { padding: 12px 16px; border-bottom: 1px solid #ecf0f1; }
        tr:last-child td { border-bottom: none; }
        tr:hover td { background: #f8f9fa; }
        .actions form { display: inline; }
        .empty { text-align: center; padding: 40px; color: #aaa; font-size: 1.1rem; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    </style>
</head>
<body>
<div class="container">
    <div class="top-bar">
        <h1>🎓 Talabalar Ro'yxati</h1>
        <a th:href="@{/students/new}" class="btn btn-primary">+ Yangi Talaba</a>
    </div>

    <table th:if="${!students.isEmpty()}">
        <thead>
            <tr>
                <th>#</th>
                <th>Ism</th>
                <th>Email</th>
                <th>Kurs</th>
                <th>Amallar</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="student, stat : ${students}">
                <td th:text="${stat.count}">1</td>
                <td th:text="${student.name}">Ism</td>
                <td th:text="${student.email}">email@example.com</td>
                <td th:text="${student.course}">Kurs</td>
                <td class="actions">
                    <a th:href="@{/students/{id}/edit(id=${student.id})}" class="btn btn-warning">✏️ Tahrirlash</a>
                    <form th:action="@{/students/{id}/delete(id=${student.id})}" method="post"
                          onsubmit="return confirm('O\'chirishni tasdiqlaysizmi?')">
                        <button type="submit" class="btn btn-danger">🗑 O'chirish</button>
                    </form>
                </td>
            </tr>
        </tbody>
    </table>

    <div class="empty" th:if="${students.isEmpty()}">
        Hozircha talabalar yo'q. <a th:href="@{/students/new}">Birinchisini qo'shing!</a>
    </div>
</div>
</body>
</html>
